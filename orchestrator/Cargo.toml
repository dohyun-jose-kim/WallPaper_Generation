[package]
name = "wall-e"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.37"
libc = "0.2"
ctrlc = "3.5"

[dev-dependencies]
tempfile = "3"
